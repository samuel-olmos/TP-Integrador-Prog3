<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>

<body>
  <script src="../js/bootstrap.bundle.min.js"></script>

  <div class="container">

    <div class="row mt-5 mb-4">
      <div class="col-md-6 offset-md-3">
        <h1 class="text-center">Sign Up</h1>
        <p class="text-center text-muted">Get started with your account</p>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 offset-md-3">
        <form id="signupForm">

          <div class="d-grid mb-3">
            <button type="button" class="btn btn-outline-dark" id="btnSignInGoogle">
              <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18" height="18"
                class="me-2">
              Sign Up with Google
            </button>
          </div>

          <div class="d-flex align items-center my-4">
            <hr class="flex-grow-1">
            <span class="mx-3 text-muted">or</span>
            <hr class="flex-grow-1">
          </div>

          <div class="row mt-4">
            <div class="col-md-6 offset-md-3 text-center">
              <p>You already have an account? <a href="#">Sign In</a></p>
            </div>
          </div>

          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password"
              required>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label" for="terms">I agree to the <a href="#">Terms and Conditions</a></label>
          </div>

          <div class="d-grid gap-2">
            <button id="signupBtn" class="btn btn-primary" type="submit">Sign Up</button>
          </div>

        </form>
      </div>
    </div>


  </div>

  <script>
    const signupForm = document.getElementById("signupForm");

    signupForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
      }

      alert("Registration successful! (This is a prototype, no actual registration is happening.)");
      console.log("User registered:", { name, email });

      signupForm.reset();
    });


    const btnSignInGoogle = document.getElementById("btnSignInGoogle");
    btnSignInGoogle.addEventListener("click", function () {
      alert("Google Sign-In is not implemented in this prototype.");
    });
  </script>
</body>

<footer class="mt-5 py-3 border-top">
  <div class="container text-center text-muted small">
    <p class="mb-1">© 2026 Your Company. All rights reserved.</p>
    <a href="#" class="text-decoration-none me-3">Términos</a>
    <a href="#" class="text-decoration-none me-3">Privacidad</a>
    <a href="#" class="text-decoration-none">Ayuda</a>
  </div>
</footer>

</html>
